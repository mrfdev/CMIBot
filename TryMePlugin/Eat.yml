# Task file
# Just enter Task number, Task itself and target materials. You can have as many materials as you want.
# Providing multiple materials in the list will require from player to eat defined amount of each material type
# Listing multiple materials in one row will define that player needs to consume specified amount of material from provided list of types.
#   For example: APPLE,BEEF,CARROT-4
#   This will require to consume 4 materials from the list, this can be 3 Beef and 1 Carrot or 4 Apples or any other variation
# Optional TaskCommands section can be used to define specific commands for specific task

#Prefix used to be added to every task description to avoid repeating entries
Prefix: '&7Be the first to eat &2'
