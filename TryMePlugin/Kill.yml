# Task file
# Just enter Task number, Task itself and target entities. You can have as many entities as you want.
# Providing multiple entities in the list will require from player to kill defined amount of each entity type
# Listing multiple entities in one row will define that player needs to kill specified amount of entities from provided list of types.
#   For example: sheep,pig,cow-4
#   This will require to kill 4 entities from the list, this can be 3 sheeps and 1 pig or 4 cows or any other variation
# Optional TaskCommands section can be used to define specific commands for specific task

#Prefix used to be added to every task description to avoid repeating entries
Prefix: '&7Kill race -> &6'
